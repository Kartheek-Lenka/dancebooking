services:
  db:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: dancebooking

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: mongodb://db:27017/dancebooking
      AUTH_SECRET: your-secret-here
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: secure-password-here
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    depends_on:
      - db

volumes:
  mongo_data:
