services:
  db:
    image: mongo:7
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: dancebooking
    healthcheck:
      test: mongosh --eval "try { rs.status() } catch (e) { rs.initiate() }" --quiet
      interval: 5s
      timeout: 30s
      retries: 30

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: mongodb://db:27017/dancebooking?replicaSet=rs0
      AUTH_SECRET: your-secret-here
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: secure-password-here
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy

volumes:
  mongo_data:
